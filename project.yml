name: CentroDeDatos
options:
  bundleIdPrefix: com.lfaz
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CentroDeDatos:
    type: application
    platform: iOS
    sources:
      # Web/index.html is the original web app, copied into the bundle as-is.
      - path: App
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lfaz.centrodedatos
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: WebKit.framework
schemes:
  CentroDeDatos:
    build:
      targets:
        CentroDeDatos: all
